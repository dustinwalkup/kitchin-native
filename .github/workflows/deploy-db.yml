name: Deploy database

# Manual-only until owner step 8.10 adds the required reviewer to the
# `production` environment. Commits land on main directly in this repo, so a
# push trigger today would apply every migration to production unapproved.
# Starting the run yourself is the approval (R28.2).
#
#   Actions → Deploy database → Run workflow → main.
#
# After 8.10, add the push trigger back (design §3.13):
#   push: { branches: [main], paths: ['supabase/migrations/**'] }
on:
  workflow_dispatch:

permissions:
  contents: read

# Serialise deploys; never cancel one mid-flight (an aborted `db push` is worse
# than a queued one).
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  # Fails fast BEFORE the production environment's approval prompt, so a run
  # started from another branch doesn't sit waiting on a reviewer only to die
  # here (28.3).
  guard:
    name: Validate request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Production deploys from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Database deploys must run from main (got $GITHUB_REF)."
          exit 1

  # Same app · database jobs that gate merges — see ci.yml. The migrations apply
  # from scratch and pass pgTAP, lint and the advisor on this commit before
  # production sees them.
  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Push migrations · production
    needs: [guard, checks]
    if: github.ref == 'refs/heads/main' # 28.3, behind the guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the secrets below. Its required reviewer (the owner) arrives with
    # 8.10 (28.2, DD3).
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    # The secrets go only on the steps that talk to production, never on
    # `npm ci`, where dependency install scripts run.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci # Supabase CLI pinned as a devDependency

      # The only place `supabase link` runs (24.8).
      - name: Link the production project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Dry run (lists pending migrations)
        run: npx supabase db push --dry-run # 28.4
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Never `--include-seed`: the seeds are local-only test fixtures (§4.9).
      - name: Push migrations
        run: npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Security advisor
        run: npx supabase db advisors --linked --type security --fail-on error # 28.6
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
